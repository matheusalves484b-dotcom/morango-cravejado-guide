name: Optimize landing page images

on: push

permissions:
  contents: write

jobs:
  optimize-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --upgrade pillow

      - name: Convert and resize landing images
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          root = Path("src/assets")
          sources = {
              "morango-cravejado-cover": (520, "morango-cravejado-cover-mobile.webp"),
              "morango-cravejado-detail": (720, "morango-cravejado-detail-mobile.webp"),
              "morango-cravejado-packaging": (720, "morango-cravejado-packaging-mobile.webp"),
          }

          for stem, (max_width, mobile_name) in sources.items():
              candidates = [root / f"{stem}.webp", root / f"{stem}.jpg", root / f"{stem}.jpeg"]
              source = next((p for p in candidates if p.exists()), None)
              if source is None:
                  raise FileNotFoundError(f"Missing source image for {stem}")

              with Image.open(source) as image:
                  image = image.convert("RGB")
                  mobile = image.copy()
                  if mobile.width > max_width:
                      mobile.thumbnail((max_width, max_width * 3), Image.Resampling.LANCZOS)
                  target = root / mobile_name
                  mobile.save(target, "WEBP", quality=68, method=6)
                  print(f"{source.name} -> {target.name} ({target.stat().st_size} bytes)")

              if source.suffix.lower() in {".jpg", ".jpeg"}:
                  target = source.with_suffix(".webp")
                  with Image.open(source) as image:
                      image.convert("RGB").save(target, "WEBP", quality=78, method=6)
          PY

      - name: Make hero image responsive
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/routes/index.tsx")
          text = path.read_text(encoding="utf-8")

          if 'morango-cravejado-cover-mobile.webp' not in text:
              text = text.replace(
                  'import coverImage from "@/assets/morango-cravejado-cover.webp";\n',
                  'import coverImage from "@/assets/morango-cravejado-cover.webp";\nimport coverMobileImage from "@/assets/morango-cravejado-cover-mobile.webp";\n'
              )

          text = text.replace(
              '{ rel: "preload", href: coverImage, as: "image" },',
              '{ rel: "preload", href: coverMobileImage, as: "image", media: "(max-width: 850px)" },\n      { rel: "preload", href: coverImage, as: "image", media: "(min-width: 851px)" },'
          )

          old = '<img src={coverImage} alt="Guia digital Morango Cravejado" fetchPriority="high" decoding="async"/>'
          new = '<picture><source media="(max-width: 850px)" srcSet={coverMobileImage}/><img src={coverImage} alt="Guia digital Morango Cravejado" fetchPriority="high" decoding="async"/></picture>'
          text = text.replace(old, new)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Reduce mobile paint effects
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/sales.css")
          text = path.read_text(encoding="utf-8")
          marker = "/* MOBILE PERFORMANCE V3 */"
          if marker not in text:
              text += "\n" + marker + "\n@media(max-width:850px){.hero-glow{display:none}.hero-product img{filter:none}.mobile-sticky{backdrop-filter:none;-webkit-backdrop-filter:none;background:#fffaf7f7}.benefit,.comparison-card,.offer-card,.guarantee-card,.cost-card{box-shadow:none}.cta{transition:none}}\n"
              path.write_text(text, encoding="utf-8")
          PY

      - name: Commit optimized assets and responsive markup
        run: |
          if git diff --quiet; then
            echo "No optimized image changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/assets/*.webp src/routes/index.tsx src/sales.css
          git commit -m "perf: optimize mobile first paint"
          git push
