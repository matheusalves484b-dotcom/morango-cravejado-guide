name: Optimize landing page images

on:
  push:
    paths:
      - "src/assets/**/*.jpg"
      - "src/assets/**/*.jpeg"

permissions:
  contents: write

jobs:
  optimize-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --upgrade pillow

      - name: Convert JPEG assets to WebP
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          root = Path("src/assets")
          for source in sorted(root.rglob("*.jpg")) + sorted(root.rglob("*.jpeg")):
              target = source.with_suffix(".webp")
              with Image.open(source) as image:
                  image = image.convert("RGB")
                  image.save(target, "WEBP", quality=78, method=6)
                  print(f"{source} -> {target} ({target.stat().st_size} bytes)")
          PY

      - name: Switch landing page imports to WebP
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/routes/index.tsx")
          text = path.read_text(encoding="utf-8")
          text = text.replace("morango-cravejado-cover.jpg", "morango-cravejado-cover.webp")
          text = text.replace("morango-cravejado-detail.jpg", "morango-cravejado-detail.webp")
          text = text.replace("morango-cravejado-packaging.jpg", "morango-cravejado-packaging.webp")
          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit optimized assets
        run: |
          if git diff --quiet; then
            echo "No optimized image changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/assets/*.webp src/routes/index.tsx
          git commit -m "perf: serve landing images as WebP"
          git push
