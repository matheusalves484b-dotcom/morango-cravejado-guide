name: Fix testimonials visual

on:
  push:
    paths:
      - '.github/workflows/fix-testimonials.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply testimonial layout
        shell: bash
        run: |
          set -e
          if grep -q 'TESTIMONIALS VISUAL V1' src/sales.css; then
            exit 0
          fi
          cat >> src/sales.css <<'EOF'

/* TESTIMONIALS VISUAL V1 */
.testimonials-section{background:linear-gradient(180deg,#fffaf7 0%,#f8eadf 100%);overflow:hidden}
.testimonials-section .narrow>p{max-width:680px;margin-left:auto;margin-right:auto;color:#7b6269;font-size:13px}
.testimonial-viewport{width:100%;overflow:hidden;margin-top:48px;padding:8px 0 18px}
.testimonial-track{display:flex;width:max-content;gap:18px;padding:0 24px;animation:testimonialMarquee 42s linear infinite;will-change:transform}
.testimonial-track:hover,.testimonial-track:focus-within{animation-play-state:paused}
.testimonial-card{width:350px;min-height:255px;flex:0 0 350px;display:flex;flex-direction:column;justify-content:space-between;background:#fff;border:1px solid #eadbd5;border-radius:22px;padding:27px;box-shadow:0 18px 45px #6e263012;position:relative;overflow:hidden}
.testimonial-card:before{content:"“";position:absolute;top:8px;right:20px;font:700 74px/1 Georgia,serif;color:#f2d8ca;pointer-events:none}
.testimonial-card>div:first-child{position:relative;z-index:1}
.testimonial-stars{color:#d58b22;letter-spacing:.16em;font-size:12px;margin-bottom:17px}
.testimonial-card p{margin:0;color:#4c343b;font:400 15px/1.72 Inter,system-ui,sans-serif}
.testimonial-meta{display:flex;align-items:center;gap:11px;margin-top:22px;padding-top:16px;border-top:1px solid #eee0da}
.testimonial-meta b{display:flex;align-items:center;justify-content:center;width:38px;height:38px;flex:0 0 38px;border-radius:50%;background:#8f2948;color:#fff;font:800 13px/1 Inter,system-ui,sans-serif;letter-spacing:0;text-transform:uppercase}
.testimonial-meta b::after{content:""!important}
.testimonial-meta span{display:block;color:#876f76;font-size:10px;line-height:1.35;font-weight:700;letter-spacing:.04em}
.testimonial-note{text-align:center;color:#9a7d84;font-size:9px;letter-spacing:.08em;text-transform:uppercase}
@keyframes testimonialMarquee{from{transform:translate3d(0,0,0)}to{transform:translate3d(calc(-50% - 9px),0,0)}}
@media(max-width:850px){
  .testimonials-section{padding-bottom:52px}
  .testimonials-section .narrow>p{font-size:12px;line-height:1.65}
  .testimonial-viewport{margin-top:32px;padding:6px 0 14px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .testimonial-viewport::-webkit-scrollbar{display:none}
  .testimonial-track{gap:12px;padding:0 12px;animation:none;width:max-content}
  .testimonial-card{width:min(82vw,330px);min-height:245px;flex-basis:min(82vw,330px);border-radius:18px;padding:22px;scroll-snap-align:start;box-shadow:0 12px 28px #6e26300e}
  .testimonial-card p{font-size:14px;line-height:1.65}
  .testimonial-stars{font-size:11px;margin-bottom:13px}
  .testimonial-meta{margin-top:18px;padding-top:13px}
  .testimonial-note{font-size:8px;margin-top:4px}
}
@media(max-width:520px){
  .testimonials-section{padding-top:52px}
  .testimonial-card{width:82vw;flex-basis:82vw;min-height:238px;padding:20px}
  .testimonial-card p{font-size:13.5px}
  .testimonial-card:before{font-size:62px;right:15px}
}
EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/sales.css
          git commit -m 'fix: restore testimonial card visual'
          git rm .github/workflows/fix-testimonials.yml
          git commit -m 'chore: remove one-time testimonial workflow'
          git push
